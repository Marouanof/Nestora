# Database
spring:
  profiles:
    default: local
  application:
    name: property-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:property_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  # JPA
  jpa:
    hibernate:
      ddl-auto : ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Uploads (images de biens) - défaut Spring = 1MB, trop petit
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always

# Server
server:
  port: ${SERVER_PORT:8082}

# Logging
logging:
  level:
    com.propertyservice.propertyservice: DEBUG

app:
  gateway:
    url: ${APP_GATEWAY_URL:http://localhost:8080}
    shared-secret: ${GATEWAY_SHARED_SECRET}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
  services:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
    booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8083}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

aws:
  s3:
    bucket-name: bucket-block-lsi
    region: eu-west-3
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
storage:
  type: local