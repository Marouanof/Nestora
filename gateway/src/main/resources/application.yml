server:
  port: 8080

app:
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET}
  jwt:
    secret: ${JWT_SECRET}
  services:
    user-service:
      uri: ${USER_SERVICE_URI:http://localhost:8081}
    property-service:
      uri: ${PROPERTY_SERVICE_URI:http://localhost:8082}
    booking-service:
      uri: ${BOOKING_SERVICE_URI:http://localhost:8083}
    payment-service:
      uri: ${PAYMENT_SERVICE_URI:http://localhost:8084}
    notification-service:
      uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: "*"
            allow-credentials: true
  profiles:
    default: local
  application:
    name: gateway-service
